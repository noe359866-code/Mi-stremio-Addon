name: Pruebas APK Lens
on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas automatizadas
        run: python -m unittest discover -s tests -v
